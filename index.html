<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Odczytaj kod QR ze zdjęcia lub obrazu z galerii. Zdjęcia pozostają na Twoim urządzeniu.">
  <title>Odczytaj kod QR</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: #18212b;
      font: 1rem/1.5 system-ui, sans-serif;
    }
    main { max-width: 34rem; margin: 0 auto; padding: 2rem 1rem; }
    h1 { margin: 0 0 .5rem; font-size: 1.75rem; line-height: 1.25; }
    h2 { font-size: 1.2rem; margin: 0 0 .75rem; }
    p { margin: .75rem 0; }
    .actions { display: flex; flex-wrap: wrap; gap: .75rem; margin: 1rem 0; }
    button, .link {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 3rem;
      padding: .65rem 1rem;
      border: 1px solid #315e9f;
      border-radius: .375rem;
      background: #fff;
      color: #234b82;
      font: inherit;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    #take-photo { background: #24569b; color: #fff; }
    button:disabled { opacity: .6; cursor: default; }
    :focus-visible { outline: 3px solid #995900; outline-offset: 3px; }
    [hidden] { display: none !important; }
    #status { min-height: 3rem; }
    #status[data-error="true"] { color: #a01c21; }
    #result { margin-top: 1.5rem; }
    textarea {
      display: block;
      width: 100%;
      min-height: 9rem;
      padding: .75rem;
      border: 1px solid #7a8694;
      border-radius: .375rem;
      background: #fff;
      color: inherit;
      font: inherit;
      resize: vertical;
      overflow-wrap: anywhere;
    }
    .note { color: #4a5563; font-size: .9rem; }
    @media (max-width: 24rem) { .actions > * { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <h1>Odczytaj kod QR</h1>
    <p>Zrób zdjęcie jednego kodu QR lub wybierz obraz z galerii.</p>
    <div class="actions">
      <button id="take-photo" type="button" disabled>Zrób zdjęcie</button>
      <button id="choose-image" type="button" disabled>Wybierz z galerii</button>
    </div>
    <input id="camera" type="file" accept="image/*" capture="environment" hidden>
    <input id="gallery" type="file" accept="image/*" hidden>
    <p id="status" role="status" aria-live="polite" aria-atomic="true">Sprawdzanie możliwości odczytu…</p>
    <section id="result" aria-labelledby="result-title" hidden>
      <h2 id="result-title">Wynik odczytu</h2>
      <textarea id="content" aria-label="Treść kodu QR" readonly spellcheck="false" rows="6"></textarea>
      <div class="actions">
        <button id="copy" type="button">Kopiuj</button>
        <a id="open-link" class="link" target="_blank" rel="noopener noreferrer" hidden>Otwórz w nowej karcie</a>
      </div>
    </section>
    <p class="note">Zdjęcia i wyniki pozostają na Twoim urządzeniu. Strona nie zapisuje historii odczytów.</p>
    <noscript><p>Włącz JavaScript w przeglądarce, aby odczytać kod QR.</p></noscript>
  </main>
  <script>
    'use strict';

    const camera = document.getElementById('camera');
    const gallery = document.getElementById('gallery');
    const takePhoto = document.getElementById('take-photo');
    const chooseImage = document.getElementById('choose-image');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const content = document.getElementById('content');
    const copy = document.getElementById('copy');
    const openLink = document.getElementById('open-link');
    let detector;

    function setStatus(message, error = false) {
      status.textContent = message;
      status.dataset.error = String(error);
    }

    function setBusy(busy) {
      takePhoto.disabled = chooseImage.disabled = camera.disabled = gallery.disabled = busy;
      document.querySelector('main').setAttribute('aria-busy', String(busy));
    }

    async function initialize() {
      try {
        if (!window.isSecureContext || !('BarcodeDetector' in window) ||
            !(await BarcodeDetector.getSupportedFormats()).includes('qr_code')) {
          throw new Error('QR unavailable');
        }
        detector = new BarcodeDetector({ formats: ['qr_code'] });
        setBusy(false);
        setStatus('Wybierz zdjęcie, aby odczytać kod QR.');
      } catch {
        setStatus('Odczyt QR jest niedostępny na tym urządzeniu lub w tej przeglądarce. Użyj aktualnego Chrome lub Brave na Androidzie z usługami Google Play i otwórz stronę przez HTTPS.', true);
      }
    }

    async function readImage(event) {
      const input = event.target;
      const file = input.files[0];
      if (!file || !detector) return;

      setBusy(true);
      result.hidden = true;
      content.value = '';
      openLink.hidden = true;
      openLink.removeAttribute('href');
      setStatus('Odczytywanie kodu QR…');

      let imageUrl;
      const image = new Image();
      try {
        imageUrl = URL.createObjectURL(file);
        image.src = imageUrl;
        await image.decode();
        const codes = await detector.detect(image);
        if (codes.length === 0) {
          setStatus('Nie znaleziono kodu QR. Zrób wyraźne zdjęcie całego kodu, bez odblasków, i spróbuj ponownie.', true);
          return;
        }

        const text = codes[0].rawValue;
        content.value = text;
        // Only explicit web addresses become links. All other QR contents stay plain text.
        if (/^https?:\/\//i.test(text)) {
          try {
            const url = new URL(text);
            if (url.protocol === 'http:' || url.protocol === 'https:') {
              openLink.href = url.href;
              openLink.hidden = false;
            }
          } catch { /* An invalid address remains plain text. */ }
        }
        result.hidden = false;
        setStatus('Odczytano kod QR.');
      } catch {
        setStatus('Nie udało się odczytać obrazu. Spróbuj zrobić nowe zdjęcie lub wybierz plik JPG, PNG albo WebP.', true);
      } finally {
        image.removeAttribute('src');
        if (imageUrl) URL.revokeObjectURL(imageUrl);
        input.value = '';
        setBusy(false);
      }
    }

    takePhoto.addEventListener('click', () => camera.click());
    chooseImage.addEventListener('click', () => gallery.click());
    camera.addEventListener('change', readImage);
    gallery.addEventListener('change', readImage);
    copy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(content.value);
        setStatus('Skopiowano wynik.');
      } catch {
        content.focus();
        content.select();
        content.setSelectionRange(0, content.value.length);
        setStatus('Nie udało się skopiować automatycznie. Treść została zaznaczona — przytrzymaj ją i wybierz „Kopiuj”.', true);
      }
    });

    initialize();
  </script>
</body>
</html>
